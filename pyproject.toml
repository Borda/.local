[tool.pytest.ini_options]
testpaths = ["plugins"]
addopts = [
    "--import-mode=importlib",
    "--color=yes",
    "--doctest-modules",
    "--cov=plugins/codemap/bin",
    "--cov=plugins/develop/bin",
    "--cov=plugins/foundry/bin",
    "--cov=plugins/oss/bin",
    "--cov=plugins/research/bin",
    "--cov-report=term-missing",
    "--cov-report=html:.reports/coverage",
]
filterwarnings = [
    "ignore::coverage.exceptions.CoverageWarning",
]
markers = [
    "integration: marks tests that require external binaries, network access, or large repo checkouts",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    ".experiments/",  # Jupytext notebook scripts — IPython builtins (get_ipython, display) not in scope
]

[tool.ruff.format]
# inherits line-length from [tool.ruff]
