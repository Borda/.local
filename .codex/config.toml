# .codex/config.toml
# OpenAI Codex CLI — Borda project config (Rust CLI v0.105+, TOML only)
# `config_file` paths are relative to this file

model                              = "gpt-5.5"
review_model                       = "gpt-5.5"
model_reasoning_effort             = "xhigh"
model_reasoning_summary            = "auto"
approval_policy                    = "on-request"
sandbox_mode                       = "workspace-write"
personality                        = "pragmatic"
suppress_unstable_features_warning = true
project_doc_fallback_filenames     = ["CONTRIBUTING.md", "CONTRIBUTING", "docs/CONTRIBUTING.md"]
commit_attribution                 = "Co-authored-by: Codex <codex@openai.com>"
# agents
max_threads             = 4
max_depth               = 2
job_max_runtime_seconds = 3600

[features]
multi_agent     = true
child_agents_md = true  # propagate AGENTS.md scope to sub-agents
personality     = true
hooks           = true

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "context-window-size",
  "used-tokens",
]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[skills]

[[skills.config]]
path = "skills/review"
enabled = true

[[skills.config]]
path = "skills/develop"
enabled = true

[[skills.config]]
path = "skills/resolve"
enabled = true

[[skills.config]]
path = "skills/audit"
enabled = true

[[skills.config]]
path = "skills/calibrate"
enabled = true

[[skills.config]]
path = "skills/release"
enabled = true

[[skills.config]]
path = "skills/investigate"
enabled = true

[[skills.config]]
path = "skills/sync"
enabled = true

[[skills.config]]
path = "skills/manage"
enabled = true

[[skills.config]]
path = "skills/analyse"
enabled = true

[[skills.config]]
path = "skills/optimize"
enabled = true

[[skills.config]]
path = "skills/research"
enabled = true

[agents.sw-engineer]
description = "Core ML/backend implementation: SOLID, type-safety, doctest-driven, reproducible ML configs. Python 3.10+."
config_file = "agents/sw-engineer.toml"

[agents.qa-specialist]
description = "Testing and reliability: edge-case matrix, The Borda Standard enforcement, suspicious verification mindset."
config_file = "agents/qa-specialist.toml"

[agents.squeezer]
description = "Performance profiling and memory optimization: profile-first, benchmark before changing, ML throughput specialist."
config_file = "agents/squeezer.toml"

[agents.doc-scribe]
description = "Documentation: 6-point Google/Napoleon docstring structure, README stewardship, CHANGELOG management."
config_file = "agents/doc-scribe.toml"

[agents.security-auditor]
description = "Security audit: OWASP Python, ML supply chain (pickle, model weights), secrets, CI/CD hygiene. Read-only."
config_file = "agents/security-auditor.toml"

[agents.data-steward]
description = "ML data pipeline integrity: split leakage, DataLoader reproducibility, augmentation correctness, class imbalance."
config_file = "agents/data-steward.toml"

[agents.cicd-steward]
description = "CI/CD reliability: GitHub Actions permissions, trusted publishing, matrix/caching, pre-commit automation, flaky CI."
config_file = "agents/cicd-steward.toml"

[agents.linting-expert]
description = "Code quality and static analysis: ruff, mypy, pre-commit config, rule selection progression, suppression discipline."
config_file = "agents/linting-expert.toml"

[agents.oss-shepherd]
description = "OSS lifecycle: issue triage, PR review, SemVer decisions, pyDeprecate, release checklist, trusted publishing."
config_file = "agents/oss-shepherd.toml"

[agents.solution-architect]
description = "System design and API planning: ADRs, interface contracts, migration plans, coupling and compatibility analysis."
config_file = "agents/solution-architect.toml"

[agents.web-explorer]
description = "Web and external-doc research: package versions, changelogs, migration guides, release notes, API reference extraction."
config_file = "agents/web-explorer.toml"

[agents.curator]
description = "Configuration quality reviewer: detect duplication, drift, stale references, weak gates, and instruction hygiene issues."
config_file = "agents/curator.toml"

[agents.challenger]
description = "Adversarial review: 6-axis stress-test of plans, architecture, migrations, and non-trivial diffs with refutation."
config_file = "agents/challenger.toml"

[agents.scientist]
description = "AI/ML research specialist: paper analysis, hypothesis design, ablations, and experiment-method verification."
config_file = "agents/scientist.toml"
