# .codex/config.toml
# OpenAI Codex CLI — project config (Rust CLI v0.105+, TOML only)
# `config_file` paths are relative to this file

model                              = "gpt-5.6-terra"
review_model                       = "gpt-5.6-terra"
model_reasoning_effort             = "high"
model_reasoning_summary            = "auto"
approval_policy                    = "on-request"
sandbox_mode                       = "workspace-write"
personality                        = "pragmatic"
suppress_unstable_features_warning = true
project_doc_fallback_filenames     = ["CONTRIBUTING.md", "CONTRIBUTING", "docs/CONTRIBUTING.md"]
commit_attribution                 = "Co-authored-by: Codex <codex@openai.com>"

[features]
multi_agent = true
personality = true
hooks       = true

[agents]
max_threads             = 4
max_depth               = 2
job_max_runtime_seconds = 3600

[tui]
status_line = [
  "model-with-reasoning",
  "context-used",
  "context-window-size",
  "used-tokens",
]

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[skills]

[[skills.config]]
path = "skills/code-review"
enabled = true

[[skills.config]]
path = "skills/develop"
enabled = true

[[skills.config]]
path = "skills/code-remediate"
enabled = true

[[skills.config]]
path = "skills/audit"
enabled = true

[[skills.config]]
path = "skills/calibrate"
enabled = true

[[skills.config]]
path = "skills/release"
enabled = true

[[skills.config]]
path = "skills/investigate"
enabled = true

[[skills.config]]
path = "skills/sync"
enabled = true

[[skills.config]]
path = "skills/manage"
enabled = true

[[skills.config]]
path = "skills/analyse"
enabled = true

[[skills.config]]
path = "skills/optimize"
enabled = true

[[skills.config]]
path = "skills/research"
enabled = true

[agents.sw-engineer]
description = "Core ML/backend: SOLID, type safety, doctest-driven, reproducible ML configs; Python 3.10+."
config_file = "agents/sw-engineer.toml"

[agents.qa-specialist]
description = "Testing/reliability: edge-case matrix, enforce project standards, suspicious-check mindset."
config_file = "agents/qa-specialist.toml"

[agents.squeezer]
description = "Performance: profile first; benchmark before change; ML throughput and memory optimization."
config_file = "agents/squeezer.toml"

[agents.doc-scribe]
description = "Documentation: project-style-first docstrings, executable examples, README and CHANGELOG stewardship."
config_file = "agents/doc-scribe.toml"

[agents.security-auditor]
description = "Security audit: OWASP Python, ML supply chain (pickle/model weights), secrets, CI/CD hygiene; read-only."
config_file = "agents/security-auditor.toml"

[agents.data-steward]
description = "ML data integrity: split leakage, DataLoader reproducibility, augmentation correctness, class imbalance."
config_file = "agents/data-steward.toml"

[agents.cicd-steward]
description = "CI/CD: GitHub Actions permissions, trusted publishing, matrix/caching, pre-commit, flaky CI diagnosis."
config_file = "agents/cicd-steward.toml"

[agents.linting-expert]
description = "Code quality/static analysis: ruff, mypy, pre-commit, rule-selection progression, suppression discipline."
config_file = "agents/linting-expert.toml"

[agents.oss-shepherd]
description = "OSS lifecycle: issue triage, PR review, SemVer, pyDeprecate, release, trusted publishing."
config_file = "agents/oss-shepherd.toml"

[agents.solution-architect]
description = "System/API design: ADRs, contracts, migrations, coupling and compatibility analysis."
config_file = "agents/solution-architect.toml"

[agents.web-explorer]
description = "Web/external-doc research: versions, changelogs, migrations, release notes, API references."
config_file = "agents/web-explorer.toml"

[agents.curator]
description = "Configuration review: duplication, drift, stale references, weak gates, instruction hygiene."
config_file = "agents/curator.toml"

[agents.challenger]
description = "Adversarial review: 6-axis stress tests for plans, architecture, migrations, non-trivial diffs; root-cause drill, mandatory refutation."
config_file = "agents/challenger.toml"

[agents.scientist]
description = "AI/ML research: paper analysis, hypothesis design, ablations, experiment-method verification."
config_file = "agents/scientist.toml"

[agents.delegation-lead]
description = "Cost-aware orchestration: route bounded workstreams across Luna, Terra, Sol; enforce handover gates."
config_file = "agents/delegation-lead.toml"
