name: Codex CI harness

on:
  push:
    branches: [main]
    paths:
      - ".codex/**"
      - ".github/codex-harness.sh"
      - ".github/workflows/ci-harness.yml"
  pull_request:
    paths:
      - ".codex/**"
      - ".github/codex-harness.sh"
      - ".github/workflows/ci-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODEX_HARNESS_RESULTS_DIR: ".github/codex-harness-results"
      OPENAI_API_KEY: ""
      OPENAI_BASE_URL: ""
      OPENAI_API_BASE: ""
      ANTHROPIC_API_KEY: ""
      GOOGLE_API_KEY: ""
      GEMINI_API_KEY: ""
      MISTRAL_API_KEY: ""
      AZURE_OPENAI_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run offline Codex harness
        run: .github/codex-harness.sh

      - name: Upload Codex harness results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: codex-harness-results
          path: .github/codex-harness-results/
          if-no-files-found: error
